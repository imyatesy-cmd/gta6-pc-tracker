name: Update tracker data

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes (12 repos x ~11 calls stays under the Action's 1,000 an hour) (GitHub may run scheduled jobs late)
  workflow_dispatch:
  push:
    paths: ['stages.json', 'scripts/update.py', 'scripts/assess.py', 'scripts/flag_changes.py']

permissions:
  contents: write
  issues: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet anthropic
      - name: Fetch repo activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # for scripts/assess.py; without it the checks just stay as they are
        run: python -I scripts/update.py
      - name: Flag changes that may move a stage
        run: python -I scripts/flag_changes.py
      - name: Open an issue for them
        if: hashFiles('issue.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "$(cat issue_title.txt)" --body-file issue.md
          rm -f issue.md issue_title.txt
      - name: Commit if changed
        run: |
          # fetched_at changes every run; only commit when something else changed too
          git add -N auto.json 2>/dev/null || true
          if git diff --quiet -- auto.json && { git diff --quiet -- data.json || [ "$(git diff -U0 -- data.json | grep -c '^[-+] ')" -le 2 ]; }; then
            echo "no change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json auto.json
          git commit -m "Update tracker data"
          git push
